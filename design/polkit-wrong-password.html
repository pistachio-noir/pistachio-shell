<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Authentication prompt, wrong password</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
input::placeholder{letter-spacing:.02em;color:#A3B08F;opacity:1}
</style>
</helmet>
<div style="position:relative;width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8">

  <!-- Desktop behind the prompt -->
  <div style="position:absolute;left:24px;top:24px;width:560px;height:470px;box-sizing:border-box;border-radius:16px;background:#15170F;border:1px solid #2A2F1F"></div>
  <div style="position:absolute;left:600px;top:24px;width:336px;height:470px;box-sizing:border-box;border-radius:16px;background:#15170F;border:1px solid #2A2F1F"></div>
  <div style="position:absolute;left:160px;bottom:16px;width:640px;height:56px;box-sizing:border-box;border-radius:28px;background:#1D2016;border:1px solid #39412A"></div>
  <!-- Scrim -->
  <div style="position:absolute;inset:0;background:rgba(13,15,9,.66)"></div>

  <section role="alertdialog" aria-modal="true" aria-labelledby="t" aria-describedby="m" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:18px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65)">

    <div style="display:flex;gap:16px;align-items:flex-start">
      <span style="width:48px;height:48px;border-radius:24px;background:#2A2F1F;color:#E0B15E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <h2 id="t" style="margin:0;font-size:18px;line-height:24px;font-weight:800;color:#F6F8EF">Authentication required</h2>
        <p id="m" style="margin:0;font-size:13px;line-height:19px;font-weight:500;color:#A3B08F">Authentication is required to install software. Enter your password to allow this.</p>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <button type="button" aria-expanded="false" style="align-self:flex-start;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border:0;border-radius:16px;background:#2A2F1F;color:#A3B08F;font-size:12px;font-weight:700;cursor:pointer">Details <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>

    <div>
      <div style="display:flex;align-items:center;gap:8px;margin:0 4px 10px">
        <span style="width:24px;height:24px;border-radius:12px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <span style="font-size:12px;font-weight:600;color:#A3B08F">Authenticating as <span style="color:#F6F8EF;font-weight:700">sxnvte</span></span>
      </div>
      <label style="display:block">
        <input type="password" value="" placeholder="Password" aria-label="Password" aria-invalid="true" aria-describedby="err" style="display:block;width:100%;height:52px;box-sizing:border-box;padding:0 22px;border:1px solid #39412A;border-radius:26px;background:#15170F;color:#F6F8EF;font-size:17px;font-weight:700;letter-spacing:.2em;text-align:center;caret-color:#9FD88A;outline:none">
      </label><span id="err" role="alert" style="display:block;text-align:center;margin-top:10px;font-size:12px;font-weight:700;color:#DB8267">Wrong password. Try again.</span>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" style="height:44px;padding:0 22px;border:0;border-radius:22px;background:#2A2F1F;color:#E5E9D8;font-size:13px;font-weight:700;cursor:pointer">Cancel</button>
      <button type="button" style="display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 22px;border:0;border-radius:22px;background:#9FD88A;color:#15170F;font-size:13px;font-weight:800;cursor:pointer">Authenticate<span style="min-width:28px;height:28px;border-radius:14px;background:#15170F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">↵</span></button>
    </div>
  </section>

</div>
</x-dc>
</body>
</html>
