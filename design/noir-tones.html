<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noir tones</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0a0a0a; color: #ddd; font-family: Manrope, sans-serif; }
  h1 { font-size: 18px; font-weight: 800; margin: 24px 24px 4px; }
  p.note { margin: 0 24px 20px; color: #999; font-size: 13px; }
  .row { display: flex; gap: 20px; padding: 0 24px 32px; flex-wrap: wrap; }
  .col { flex: 1 1 380px; border-radius: 16px; padding: 22px; box-sizing: border-box; }
  .col h2 { margin: 0 0 14px; font-size: 15px; font-weight: 800; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
  .sw { height: 34px; border-radius: 8px; display: flex; align-items: flex-end; padding: 3px 5px; box-sizing: border-box; font: 9px/1 'JetBrains Mono', monospace; }
  .panel { border-radius: 28px; padding: 18px; margin-bottom: 18px; }
  .panel .title { font-weight: 800; font-size: 15px; margin-bottom: 2px; }
  .panel .sub { font-size: 12px; margin-bottom: 12px; }
  .ws { display: flex; gap: 6px; margin-bottom: 14px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 3px; }
  .dot.on { width: 20px; }
  .rowitem { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 18px; font-size: 13px; font-weight: 700; }
  .switch { width: 40px; height: 22px; border-radius: 11px; position: relative; }
  .switch i { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 8px; }
  .slider { height: 8px; border-radius: 4px; margin: 14px 0; position: relative; }
  .slider b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { padding: 10px 16px; border-radius: 22px; font-size: 13px; font-weight: 800; }
  .tui { font-family: 'JetBrains Mono', monospace; font-size: 13.33px; line-height: 20px; position: relative; padding: 18px 14px 12px; margin-top: 12px; }
  .tab { position: absolute; top: -10px; left: 8px; padding: 0 8px; font-weight: 700; }
  .tab.r { left: auto; right: 8px; font-weight: 400; }
  .tl { display: flex; justify-content: space-between; padding: 6px 10px; margin: 0 -10px; }
  pre { margin: 10px 0 0; padding: 10px 12px; font: 12.5px/18px 'JetBrains Mono', monospace; white-space: pre; overflow: hidden; }
</style>
</head>
<body>
<h1>Noir: three grey tones</h1>
<p class="note">Same pieces in each: palette, a Classic panel (workspaces, selected row, switch, slider, buttons, an error), a TUI frame and a code block. Active things are light grey with dark text; the one red marks errors and danger. Pick a column (or say "between these").</p>
<div class="row" id="row"></div>
<script>
const tones = [
  { name: "Pure neutral", bg: "#111111", bgAlt: "#1A1A1A", overlay: "#262626", overlay2: "#333333", muted: "#5E5E5E", subtext: "#A6A6A6", text: "#E6E6E6", bright: "#F7F7F7", active: "#BDBDBD", red: "#C9675C" },
  { name: "Slightly warm", bg: "#131211", bgAlt: "#1C1B19", overlay: "#282624", overlay2: "#35332F", muted: "#615D57", subtext: "#A8A49D", text: "#E8E5E0", bright: "#F8F6F2", active: "#C2BDB5", red: "#CC6B58" },
  { name: "Slightly cool", bg: "#101113", bgAlt: "#191A1D", overlay: "#25272B", overlay2: "#323439", muted: "#5B5E64", subtext: "#A3A6AD", text: "#E4E6EA", bright: "#F6F7F9", active: "#B8BCC4", red: "#C46660" }
];
const row = document.getElementById("row");
for (const t of tones) {
  const sw = ["bg","bgAlt","overlay","overlay2","muted","subtext","text","bright","active","red"]
    .map(k => `<div class="sw" style="background:${t[k]};color:${["text","bright","active","subtext"].includes(k) ? t.bg : t.text}">${k}</div>`).join("");
  row.insertAdjacentHTML("beforeend", `
  <div class="col" style="background:${t.bg};color:${t.text}">
    <h2 style="color:${t.bright}">${t.name}</h2>
    <div class="swatches">${sw}</div>

    <div class="panel" style="background:${t.bgAlt};border:1px solid ${t.overlay2}">
      <div class="title" style="color:${t.bright}">Quick settings</div>
      <div class="sub" style="color:${t.subtext}">Up 3 h 12 min · 1 Gbps</div>
      <div class="ws">
        <span class="dot on" style="background:${t.active}"></span>
        <span class="dot" style="background:${t.subtext}"></span>
        <span class="dot" style="background:${t.subtext}"></span>
        <span class="dot" style="border:1.5px solid ${t.muted};width:3px;height:3px"></span>
      </div>
      <div class="rowitem" style="background:${t.active};color:${t.bg}">Bluetooth <span style="font-weight:600">AirPods</span></div>
      <div class="rowitem" style="color:${t.text}">Do not disturb
        <span class="switch" style="background:${t.active}"><i style="right:3px;background:${t.bg}"></i></span></div>
      <div class="rowitem" style="color:${t.text}">Night light
        <span class="switch" style="background:${t.overlay2}"><i style="left:3px;background:${t.subtext}"></i></span></div>
      <div class="slider" style="background:${t.overlay}"><b style="width:62%;background:${t.active}"></b></div>
      <div style="font-size:12px;font-weight:700;color:${t.red}">Couldn’t reach Claude</div>
      <div class="btns">
        <span class="btn" style="background:${t.active};color:${t.bg}">Try again</span>
        <span class="btn" style="background:${t.overlay};color:${t.text}">Cancel</span>
        <span class="btn" style="background:${t.overlay};color:${t.red}">Shut down</span>
      </div>
    </div>

    <div class="tui" style="background:${t.bg};border:1px solid ${t.overlay2}">
      <span class="tab" style="background:${t.active};color:${t.bg}">capture</span>
      <span class="tab r" style="background:${t.bg};color:${t.subtext}">7 actions</span>
      <div class="tl" style="background:${t.active};color:${t.bg};font-weight:700"><span>[r]&nbsp;&nbsp;screenshot region</span></div>
      <div class="tl" style="color:${t.text};font-weight:700"><span><span style="color:${t.bright}">[w]</span>&nbsp;&nbsp;screenshot window</span></div>
      <div class="tl" style="color:${t.text}"><span><span style="color:${t.red};font-weight:700">[!]</span> couldn’t reach claude</span></div>
      <div class="tl" style="color:${t.subtext}"><span>cpu <b style="color:${t.text}">27%</b>&nbsp;&nbsp;mem <b style="color:${t.text}">9.8G</b>&nbsp;&nbsp;vol <b style="color:${t.text}">50%</b></span></div>
      <div style="margin-top:6px"><span style="color:${t.active}">&gt;</span> <span style="color:${t.bright};font-weight:700">ask a follow-up</span><span style="background:${t.active};color:${t.active}">_</span></div>
    </div>

    <pre style="background:${t.bgAlt};color:${t.text}"><span style="color:${t.bright};font-weight:700">fn</span> count(text: &amp;<span style="color:${t.subtext}">str</span>) -&gt; Counts {
    <span style="color:${t.muted};font-style:italic">// lines, words and bytes</span>
    <span style="color:${t.bright};font-weight:700">let</span> n = text.lines().count();
    println!(<span style="color:${t.subtext}">"{}"</span>, n);
}</pre>
  </div>`);
}
</script>
</body>
</html>
