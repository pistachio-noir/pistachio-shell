<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher Bluetooth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:48px">

  <section aria-label="Launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:12px;height:68px;box-sizing:border-box;padding:0 26px">
      <span style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:#2A2F1F;color:#F6F8EF;font-size:13px;font-weight:700;flex:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        Bluetooth
      </span>
      <input type="text" value="" placeholder="Filter devices…" aria-label="Filter Bluetooth devices" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid #2A2F1F">
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">All</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Apps</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Windows</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Workspaces</button>
      <button type="button" aria-pressed="true" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#2A2F1F;color:#9FD88A;font-size:13px;font-weight:700;cursor:pointer">System</button>
    </div>

    <div style="padding:14px 8px 8px;display:flex;flex-direction:column;gap:10px">

      <div style="display:flex;align-items:center;gap:14px;height:60px;box-sizing:border-box;padding:0 8px 0 14px;border-radius:20px;background:#2A2F1F">
        <span style="width:38px;height:38px;border-radius:19px;background:#39412A;color:#9FD88A;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        </span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font-size:15px;font-weight:700;line-height:20px;color:#F6F8EF">Bluetooth</span>
          <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">On · discoverable</span>
        </span>
        <button type="button" role="switch" aria-checked="true" aria-label="Bluetooth" style="width:60px;height:44px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <span style="width:48px;height:28px;border-radius:14px;background:#9FD88A;position:relative;display:block">
            <span style="position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:10px;background:#15170F"></span>
          </span>
        </button>
      </div>

      <div>
        <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Paired devices</span>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">

          <li>
            <button type="button" aria-selected="true" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;cursor:pointer;text-align:left">
              <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:15px;font-weight:700;line-height:20px">Headphones</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Connected · battery 74%</span>
              </span>
              <span style="display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 12px;box-sizing:border-box;border-radius:14px;background:#9FD88A;color:#15170F;font-size:12px;font-weight:800">Disconnect<span style="min-width:18px;height:18px;border-radius:9px;background:#15170F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:11px">↵</span></span>
            </button>
          </li>

          <li>
            <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:15px;font-weight:700;line-height:20px">Keyboard</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Not connected</span>
              </span>
              <span style="font-size:12px;font-weight:700;color:#A3B08F">Connect</span>
            </button>
          </li>

          <li>
            <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:15px;font-weight:700;line-height:20px">Controller</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Not connected</span>
              </span>
              <span style="font-size:12px;font-weight:700;color:#A3B08F">Connect</span>
            </button>
          </li>
        </ul>
      </div>

      <div>
        <span style="display:flex;align-items:center;gap:8px;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          Scanning for new devices
        </span>
        <button type="button" aria-selected="false" style="width:100%;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
          <span style="width:34px;height:34px;border-radius:17px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><path d="M12 6h.01"/></svg>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
            <span style="font-size:14px;font-weight:700;line-height:19px">Speaker 3F:2A</span>
            <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Nearby · not paired</span>
          </span>
          <span style="font-size:12px;font-weight:700;color:#A3B08F">Pair</span>
        </button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↑↓</span>navigate</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>connect / disconnect</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">⌫</span>forget device</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
