<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App launcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:72px">

  <section aria-label="App launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:14px;height:68px;box-sizing:border-box;padding:0 26px;border-bottom:1px solid #2A2F1F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" value="ne" aria-label="Search applications" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="padding:14px 8px 8px">
      <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Applications</span>
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">

        <li>
          <button type="button" aria-selected="true" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#AC8ED0;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px"><span style="color:#9FD88A">Ne</span>ovim</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Text editor</span>
            </span>
            <span style="min-width:28px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:13px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">↵</span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#7FC9A8;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px"><span style="color:#9FD88A">Ne</span>twork Connections</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Manage Ethernet and VPN</span>
            </span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px"><span style="color:#9FD88A">Ne</span>twork Manager TUI</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Terminal interface for network settings</span>
            </span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#E0B15E;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">Ge<span style="color:#9FD88A">ne</span>ral Notes</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">~/notes.md</span>
            </span>
          </button>
        </li>
      </ul>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↑↓</span>navigate</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>open</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
