<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification popups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width:480px;height:440px;box-sizing:border-box;padding:40px;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;flex-direction:column;gap:12px">

  <!-- Normal, with actions -->
  <div role="status" style="display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:24px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <span style="width:40px;height:40px;border-radius:20px;background:#2A2F1F;color:#9FD88A;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:14px;font-weight:700;color:#F6F8EF">Download complete</span>
          <span style="margin-left:auto;font-size:11px;font-weight:600;color:#A3B08F">now</span>
        </div>
        <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">kawaii-utils.tar.gz was saved to Downloads.</span>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" style="height:40px;padding:0 16px;border:0;border-radius:20px;background:#9FD88A;color:#15170F;font-size:12px;font-weight:800;cursor:pointer">Open folder</button>
        <button type="button" style="height:40px;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;font-size:12px;font-weight:700;cursor:pointer">Dismiss</button>
      </div>
    </div>
  </div>

  <!-- Critical -->
  <div role="alert" style="display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:24px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <span style="width:40px;height:40px;border-radius:20px;background:#2A2F1F;color:#DB8267;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>
    </span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:14px;font-weight:700;color:#F6F8EF">Disk almost full</span>
        <span style="margin-left:auto;font-size:11px;font-weight:600;color:#DB8267">Critical</span>
      </div>
      <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">Only 4 GB left on /home. Clear some space.</span>
    </div>
  </div>

  <!-- Quiet -->
  <div role="status" style="display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:24px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <span style="width:40px;height:40px;border-radius:20px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:14px;font-weight:700;color:#F6F8EF">Screenshot saved</span>
        <span style="margin-left:auto;font-size:11px;font-weight:600;color:#A3B08F">now</span>
      </div>
      <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">~/Pictures/screenshot-1125.png</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
