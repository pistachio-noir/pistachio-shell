<!doctype html>

<head>

<x-dc>
<helmet>

input{font:inherit}

<div style="position:relative;width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center">

  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-40px">
    <span style="font-size:132px;font-weight:800;line-height:132px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#F6F8EF">11:25</span>
    <span style="font-size:20px;font-weight:600;color:#A3B08F">Sunday, 25 October</span>
  </div>

  <div style="margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <span style="width:64px;height:64px;border-radius:32px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </span>
      <span style="font-size:16px;font-weight:700;color:#F6F8EF">sxnvte</span>
    </div>
    <label style="display:block">
      <input type="password" value="" placeholder="Password" aria-label="Password" aria-invalid="true" aria-describedby="err" style="display:block;width:320px;height:56px;box-sizing:border-box;padding:0 24px;border:1px solid #39412A;border-radius:28px;background:#1D2016;color:#F6F8EF;font-size:18px;font-weight:700;letter-spacing:.2em;text-align:center;caret-color:#9FD88A;outline:none;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    </label>
    <span id="err" role="alert" style="font-size:12px;font-weight:700;color:#DB8267">Wrong password. Try again.</span>
  </div>

  <!-- Session and keyboard layout -->
  <div style="position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:8px">
    <button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Session: Hyprland" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 16px;border:1px solid #39412A;border-radius:20px;background:#1D2016;color:#E5E9D8;font-size:13px;font-weight:700;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      Hyprland
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button type="button" aria-label="Keyboard layout: Polish" style="height:40px;min-width:48px;padding:0 14px;border:1px solid #39412A;border-radius:20px;background:#1D2016;color:#E5E9D8;font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer">PL</button>
  </div>

  <!-- Power -->
  <div style="position:absolute;right:24px;bottom:24px;display:flex;align-items:center;gap:4px;height:40px;box-sizing:border-box;padding:0 4px;border-radius:20px;background:#1D2016;border:1px solid #39412A">
    <button type="button" aria-label="Suspend" style="width:32px;height:32px;border:0;border-radius:16px;background:none;color:#E5E9D8;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <button type="button" aria-label="Reboot" style="width:32px;height:32px;border:0;border-radius:16px;background:none;color:#E5E9D8;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button type="button" aria-label="Shut down" style="width:32px;height:32px;border:0;border-radius:16px;background:none;color:#DB8267;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#DB8267" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></button>
  </div>

</div>
</x-dc>
