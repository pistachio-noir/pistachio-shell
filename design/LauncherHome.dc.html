<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:48px">

  <section aria-label="Launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:14px;height:68px;box-sizing:border-box;padding:0 26px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" value="" placeholder="Search apps, windows, system…" aria-label="Search" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid #2A2F1F">
      <button type="button" aria-pressed="true" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#2A2F1F;color:#9FD88A;font-size:13px;font-weight:700;cursor:pointer">All</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Apps</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Windows</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Workspaces</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">System</button>
    </div>

    <div style="padding:14px 8px 8px;display:flex;flex-direction:column;gap:10px">

      <div>
        <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Quick controls</span>
        <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
          <button type="button" aria-selected="true" style="height:80px;box-sizing:border-box;padding:0 16px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <span style="display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:700">Volume</span><span style="font-size:12px;font-weight:700;color:#A3B08F">62%</span></span>
          </button>
          <button type="button" aria-selected="false" style="height:80px;box-sizing:border-box;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#F6F8EF;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <span style="display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:700">Brightness</span><span style="font-size:12px;font-weight:700;color:#A3B08F">80%</span></span>
          </button>
          <button type="button" aria-selected="false" style="height:80px;box-sizing:border-box;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#F6F8EF;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
            <span style="display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:700">Bluetooth</span><span style="font-size:12px;font-weight:700;color:#A3B08F">On</span></span>
          </button>
          <button type="button" aria-selected="false" style="height:80px;box-sizing:border-box;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#F6F8EF;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
            <span style="display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:700">Ethernet</span><span style="font-size:12px;font-weight:700;color:#A3B08F">1 Gbps</span></span>
          </button>
        </div>
      </div>

      <div>
        <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Open windows</span>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">
          <li>
            <button type="button" style="width:100%;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:34px;height:34px;border-radius:17px;background:#2A2F1F;color:#AC8ED0;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:14px;font-weight:700;line-height:19px">src/main.rs</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">nvim · focused</span>
              </span>
              <span style="min-width:30px;height:24px;padding:0 9px;box-sizing:border-box;border-radius:12px;background:#2A2F1F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">2</span>
            </button>
          </li>
          <li>
            <button type="button" style="width:100%;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:34px;height:34px;border-radius:17px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:14px;font-weight:700;line-height:19px">Pull requests · kawaii-utils</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">firefox</span>
              </span>
              <span style="min-width:30px;height:24px;padding:0 9px;box-sizing:border-box;border-radius:12px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">3</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">←↑↓→</span>navigate</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>open</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Tab</span>switch mode</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
