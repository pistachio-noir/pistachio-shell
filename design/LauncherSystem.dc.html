<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher system controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:48px">

  <section aria-label="Launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:12px;height:68px;box-sizing:border-box;padding:0 26px">
      <span style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:#2A2F1F;color:#F6F8EF;font-size:13px;font-weight:700;flex:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        System
      </span>
      <input type="text" value="vol" aria-label="Search system controls" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid #2A2F1F">
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">All</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Apps</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Windows</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Workspaces</button>
      <button type="button" aria-pressed="true" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#2A2F1F;color:#9FD88A;font-size:13px;font-weight:700;cursor:pointer">System</button>
    </div>

    <div style="padding:14px 8px 8px;display:flex;flex-direction:column;gap:10px">

      <div>
        <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Audio</span>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">

          <!-- Volume, selected -->
          <li style="display:flex;align-items:center;gap:14px;height:78px;box-sizing:border-box;padding:0 10px 0 14px;border-radius:20px;background:#39412A">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#9FD88A;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:baseline;justify-content:space-between">
                <span style="font-size:15px;font-weight:700;color:#F6F8EF">Volume</span>
                <span style="font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#E5E9D8">62%</span>
              </div>
              <label style="position:relative;display:block;height:20px">
                <span style="position:absolute;left:0;right:0;top:6px;height:8px;border-radius:4px;background:#1D2016"></span>
                <span style="position:absolute;left:0;top:6px;width:62%;height:8px;border-radius:4px;background:#9FD88A"></span>
                <span style="position:absolute;left:calc(62% - 9px);top:1px;width:18px;height:18px;border-radius:9px;background:#F6F8EF;box-shadow:0 2px 6px rgba(0,0,0,.5)"></span>
                <input type="range" min="0" max="100" value="62" aria-label="Volume" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
              </label>
            </div>
            <button type="button" aria-label="Mute volume" style="width:44px;height:44px;border:0;border-radius:22px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
            </button>
          </li>

          <!-- Microphone, muted -->
          <li style="display:flex;align-items:center;gap:14px;height:78px;box-sizing:border-box;padding:0 10px 0 14px;border-radius:20px">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 2 20 20"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M19 10v2a7 7 0 0 1-.11 1.23M5 10v2a7 7 0 0 0 11.8 5.1"/><path d="M12 19v3"/></svg>
            </span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:baseline;justify-content:space-between">
                <span style="font-size:15px;font-weight:700;color:#E5E9D8">Microphone</span>
                <span style="font-size:12px;font-weight:700;color:#A3B08F">Muted</span>
              </div>
              <label style="position:relative;display:block;height:20px">
                <span style="position:absolute;left:0;right:0;top:6px;height:8px;border-radius:4px;background:#2A2F1F"></span>
                <span style="position:absolute;left:0;top:6px;width:40%;height:8px;border-radius:4px;background:#39412A"></span>
                <input type="range" min="0" max="100" value="40" aria-label="Microphone volume" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
              </label>
            </div>
            <button type="button" aria-label="Unmute microphone" style="width:44px;height:44px;border:0;border-radius:22px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
            </button>
          </li>
        </ul>
      </div>

      <div>
        <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Output device</span>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">
          <li>
            <button type="button" aria-current="true" style="width:100%;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:34px;height:34px;border-radius:17px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><path d="M12 6h.01"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:14px;font-weight:700;line-height:19px">Speakers</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Built-in audio · current</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </li>
          <li>
            <button type="button" aria-current="false" style="width:100%;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
              <span style="width:34px;height:34px;border-radius:17px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font-size:14px;font-weight:700;line-height:19px">Headphones</span>
                <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">Bluetooth · connected</span>
              </span>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">←→</span>adjust</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">M</span>mute</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>choose device</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
