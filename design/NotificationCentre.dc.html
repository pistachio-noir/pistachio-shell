<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification centre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="position:relative;width:720px;height:600px;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8">

  <!-- Panel -->
  <section aria-label="Notification centre" style="position:absolute;right:40px;bottom:88px;width:400px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;gap:14px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 18px 44px rgba(0,0,0,.6)">

    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <h2 style="margin:0;font-size:17px;font-weight:800;color:#F6F8EF">Notifications</h2>
      <button type="button" style="height:44px;padding:0 14px;border:0;border-radius:22px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Clear all</button>
    </div>

    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
      <li style="display:flex;gap:12px;align-items:flex-start;padding:14px 8px 14px 14px;border-radius:20px;background:#2A2F1F">
        <span style="width:36px;height:36px;border-radius:18px;background:#39412A;color:#7FC9A8;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:6px;height:6px;border-radius:3px;background:#9FD88A;flex:none"></span>
            <span style="font-size:13px;font-weight:700;color:#F6F8EF">Build finished</span>
            <span style="margin-left:auto;font-size:11px;font-weight:600;color:#A3B08F;white-space:nowrap">2 min</span>
          </div>
          <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">kawaii-wc built and ran in 0.42 s.</span>
        </div>
        <button type="button" aria-label="Dismiss notification" style="width:44px;height:44px;margin:-8px -2px -8px 0;border:0;background:none;color:#A3B08F;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </li>
      <li style="display:flex;gap:12px;align-items:flex-start;padding:14px 8px 14px 14px;border-radius:20px;background:#2A2F1F">
        <span style="width:36px;height:36px;border-radius:18px;background:#39412A;color:#E0B15E;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:6px;height:6px;border-radius:3px;background:#9FD88A;flex:none"></span>
            <span style="font-size:13px;font-weight:700;color:#F6F8EF">Rust exercises</span>
            <span style="margin-left:auto;font-size:11px;font-weight:600;color:#A3B08F;white-space:nowrap">28 min</span>
          </div>
          <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">Starts at 12:00. Ownership and borrowing, chapter 4.</span>
        </div>
        <button type="button" aria-label="Dismiss notification" style="width:44px;height:44px;margin:-8px -2px -8px 0;border:0;background:none;color:#A3B08F;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </li>
      <li style="display:flex;gap:12px;align-items:flex-start;padding:14px 8px 14px 14px;border-radius:20px;background:#2A2F1F">
        <span style="width:36px;height:36px;border-radius:18px;background:#39412A;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        </span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:6px;height:6px;border-radius:3px;background:#9FD88A;flex:none"></span>
            <span style="font-size:13px;font-weight:700;color:#F6F8EF">System updates</span>
            <span style="margin-left:auto;font-size:11px;font-weight:600;color:#A3B08F;white-space:nowrap">1 h</span>
          </div>
          <span style="font-size:12px;font-weight:500;line-height:17px;color:#A3B08F">14 packages can be upgraded.</span>
        </div>
        <button type="button" aria-label="Dismiss notification" style="width:44px;height:44px;margin:-8px -2px -8px 0;border:0;background:none;color:#A3B08F;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </li>
    </ul>

    <div style="display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid #2A2F1F">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
      <span style="flex:1;font-size:13px;font-weight:700;color:#F6F8EF">Do not disturb</span>
      <button type="button" role="switch" aria-checked="false" aria-label="Do not disturb" style="width:52px;height:44px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <span style="width:48px;height:28px;border-radius:14px;background:#39412A;position:relative;display:block">
          <span style="position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:#A3B08F"></span>
        </span>
      </button>
    </div>
  </section>

  <!-- Bar, clock chip pressed -->
  <div style="position:absolute;left:40px;bottom:16px;width:640px;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.6)">
    <div style="display:flex;align-items:center;height:40px;padding:0 6px 0 10px">
      <button type="button" aria-label="Workspace 1" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
      <button type="button" aria-label="Workspace 2, active" aria-current="true" style="width:34px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:26px;height:8px;border-radius:4px;background:#9FD88A"></span></button>
      <button type="button" aria-label="Workspace 3" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
      <button type="button" aria-label="Workspace 4, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
      <button type="button" aria-label="Workspace 5, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 4px">
      <span style="font-size:13px;font-weight:700;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#F6F8EF">src/main.rs</span>
      <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">nvim</span>
    </div>
    <button type="button" aria-expanded="true" aria-label="Notifications, open. 11:25, Sunday 25 October" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 14px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;cursor:pointer;text-align:left">
      <span style="position:relative;width:18px;height:18px;display:block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span style="position:absolute;top:-5px;right:-5px;width:9px;height:9px;border-radius:5px;background:#9FD88A;border:2px solid #39412A;box-sizing:content-box"></span>
      </span>
      <span style="display:flex;flex-direction:column">
        <span style="font-size:14px;font-weight:800;line-height:17px;font-variant-numeric:tabular-nums;color:#F6F8EF">11:25</span>
        <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Sun 25 Oct</span>
      </span>
    </button>
    <button type="button" aria-label="Quick settings: Ethernet connected, Bluetooth on, volume 62%" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
