<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On-screen display</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:640px;height:360px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">

  <!-- Volume -->
  <div role="status" aria-label="Volume 62 percent" style="width:320px;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 22px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F8EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    <div style="flex:1;height:8px;border-radius:4px;background:#2A2F1F;position:relative">
      <div style="position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:4px;background:#9FD88A"></div>
    </div>
    <span style="width:30px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:#F6F8EF">62</span>
  </div>

  <!-- Brightness -->
  <div role="status" aria-label="Brightness 80 percent" style="width:320px;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 22px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F8EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <div style="flex:1;height:8px;border-radius:4px;background:#2A2F1F;position:relative">
      <div style="position:absolute;left:0;top:0;bottom:0;width:80%;border-radius:4px;background:#9FD88A"></div>
    </div>
    <span style="width:30px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:#F6F8EF">80</span>
  </div>

  <!-- Muted -->
  <div role="status" aria-label="Volume muted" style="width:320px;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 22px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3B08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    <div style="flex:1;height:8px;border-radius:4px;background:#2A2F1F;position:relative">
      <div style="position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:4px;background:#39412A"></div>
    </div>
    <span style="width:50px;text-align:right;white-space:nowrap;font-size:13px;font-weight:800;color:#A3B08F">Muted</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":360}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
