<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher windows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:48px">

  <section aria-label="Launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:12px;height:68px;box-sizing:border-box;padding:0 26px">
      <span style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:#2A2F1F;color:#F6F8EF;font-size:13px;font-weight:700;flex:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
        Windows
      </span>
      <input type="text" value="" placeholder="Find a window by title or app…" aria-label="Find a window" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid #2A2F1F">
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">All</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Apps</button>
      <button type="button" aria-pressed="true" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#2A2F1F;color:#9FD88A;font-size:13px;font-weight:700;cursor:pointer">Windows</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Workspaces</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">System</button>
    </div>

    <div style="padding:14px 8px 8px">
      <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">5 windows · most recent first</span>
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#AC8ED0;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">src/main.rs</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">nvim · focused</span>
            </span>
            <span style="min-width:34px;height:26px;padding:0 10px;box-sizing:border-box;border-radius:13px;background:#2A2F1F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">2</span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#7FC9A8;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">cargo run</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">foot</span>
            </span>
            <span style="min-width:34px;height:26px;padding:0 10px;box-sizing:border-box;border-radius:13px;background:#2A2F1F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">2</span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="true" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#7DA3B3;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">Pull requests · kawaii-utils</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">firefox</span>
            </span>
            <span style="min-width:34px;height:26px;padding:0 10px;box-sizing:border-box;border-radius:13px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">3</span>
            <span style="display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 12px;box-sizing:border-box;border-radius:14px;background:#9FD88A;color:#15170F;font-size:12px;font-weight:800">Switch<span style="min-width:18px;height:18px;border-radius:9px;background:#15170F;color:#9FD88A;display:flex;align-items:center;justify-content:center;font-size:11px">↵</span></span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#E0B15E;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">notes.md</span>
              <span style="font-size:12px;font-weight:500;line-height:16px;color:#A3B08F">nvim</span>
            </span>
            <span style="min-width:34px;height:26px;padding:0 10px;box-sizing:border-box;border-radius:13px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">1</span>
          </button>
        </li>

        <li>
          <button type="button" aria-selected="false" style="width:100%;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-radius:20px;background:none;color:#E5E9D8;cursor:pointer;text-align:left">
            <span style="width:38px;height:38px;border-radius:19px;background:#2A2F1F;color:#DB8267;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:15px;font-weight:700;line-height:20px">dotnet build</span>
              <span style="font-size:12px;font-weight:600;line-height:16px;color:#DB8267">foot · needs attention</span>
            </span>
            <span style="min-width:34px;height:26px;padding:0 10px;box-sizing:border-box;border-radius:13px;background:#2A2F1F;color:#DB8267;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">4</span>
          </button>
        </li>
      </ul>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>switch</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Ctrl M</span>bring here</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Ctrl W</span>close window</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
