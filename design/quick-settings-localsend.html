<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick settings with LocalSend</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="position:relative;width:720px;height:640px;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8">

  <!-- Panel -->
  <section aria-label="Quick settings" style="position:absolute;left:300px;bottom:84px;width:380px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;gap:16px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 18px 44px rgba(0,0,0,.6)">

    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <button type="button" aria-pressed="true" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
        <span style="width:36px;height:36px;border-radius:18px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
        </span>
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">Ethernet</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">1 Gbps</span>
        </span>
      </button>
      <button type="button" aria-pressed="true" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
        <span style="width:36px;height:36px;border-radius:18px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        </span>
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">Bluetooth</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Headphones</span>
        </span>
      </button>
      <button type="button" aria-pressed="false" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
        <span style="width:36px;height:36px;border-radius:18px;background:#39412A;color:#A3B08F;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
        </span>
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">Do not disturb</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Off</span>
        </span>
      </button>
      <button type="button" aria-pressed="true" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
        <span style="width:36px;height:36px;border-radius:18px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </span>
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">Night light</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Until 07:00</span>
        </span>
      </button>
    </div>

    <button type="button" aria-label="LocalSend, receiving as pistachio-pc, 4 devices nearby. Open" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 8px 0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
      <span style="width:36px;height:36px;border-radius:18px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg></span>
      <span style="flex:1;display:flex;flex-direction:column;min-width:0">
        <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">LocalSend</span>
        <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Receiving as pistachio-pc · 4 nearby</span>
      </span>
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#A3B08F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m9 18 6-6-6-6"/></svg></span>
    </button>

    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:12px;height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E9D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <label style="position:relative;flex:1;height:44px;display:block">
          <span style="position:absolute;left:0;right:0;top:17px;height:10px;border-radius:5px;background:#2A2F1F"></span>
          <span style="position:absolute;left:0;top:17px;width:62%;height:10px;border-radius:5px;background:#9FD88A"></span>
          <span style="position:absolute;left:calc(62% - 10px);top:12px;width:20px;height:20px;border-radius:10px;background:#F6F8EF;box-shadow:0 2px 6px rgba(0,0,0,.5)"></span>
          <input type="range" min="0" max="100" value="62" aria-label="Volume" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
        </label>
        <span style="width:42px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#A3B08F">62</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E9D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <label style="position:relative;flex:1;height:44px;display:block">
          <span style="position:absolute;left:0;right:0;top:17px;height:10px;border-radius:5px;background:#2A2F1F"></span>
          <span style="position:absolute;left:0;top:17px;width:80%;height:10px;border-radius:5px;background:#9FD88A"></span>
          <span style="position:absolute;left:calc(80% - 10px);top:12px;width:20px;height:20px;border-radius:10px;background:#F6F8EF;box-shadow:0 2px 6px rgba(0,0,0,.5)"></span>
          <input type="range" min="0" max="100" value="80" aria-label="Brightness" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
        </label>
        <span style="width:42px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#A3B08F">80</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E9D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
        <label style="position:relative;flex:1;height:44px;display:block">
          <span style="position:absolute;left:0;right:0;top:17px;height:10px;border-radius:5px;background:#2A2F1F"></span>
          <span style="position:absolute;left:0;top:17px;width:23%;height:10px;border-radius:5px;background:#9FD88A"></span>
          <span style="position:absolute;left:calc(23% - 10px);top:12px;width:20px;height:20px;border-radius:10px;background:#F6F8EF;box-shadow:0 2px 6px rgba(0,0,0,.5)"></span>
          <input type="range" min="2500" max="6500" step="100" value="3400" aria-label="Night light warmth, kelvin" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer">
        </label>
        <span style="width:42px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#A3B08F">3400K</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid #2A2F1F">
      <div style="flex:1;display:flex;align-items:center;gap:10px;min-width:0">
        <svg width="22" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E9D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span style="display:flex;flex-direction:column">
          <span style="font-size:13px;font-weight:700;line-height:17px;color:#F6F8EF">3 h 12 min</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Uptime</span>
        </span>
      </div>
      <button type="button" aria-label="Power menu" style="width:44px;height:44px;border:0;border-radius:22px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg>
      </button>
    </div>
  </section>

  <!-- Bar, status chip pressed -->
  <div style="position:absolute;left:40px;bottom:16px;width:640px;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.6)">
    <div style="display:flex;align-items:center;height:40px;padding:0 6px 0 10px">
      <button type="button" aria-label="Workspace 1" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
      <button type="button" aria-label="Workspace 2, active" aria-current="true" style="width:34px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:26px;height:8px;border-radius:4px;background:#9FD88A"></span></button>
      <button type="button" aria-label="Workspace 3" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
      <button type="button" aria-label="Workspace 4, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
      <button type="button" aria-label="Workspace 5, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 4px">
      <span style="font-size:13px;font-weight:700;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#F6F8EF">src/main.rs</span>
      <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">nvim</span>
    </div>
    <button type="button" aria-label="Notifications. 16:31, Monday 2 November" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span style="display:flex;flex-direction:column">
        <span style="font-size:14px;font-weight:800;line-height:17px;font-variant-numeric:tabular-nums;color:#F6F8EF">16:31</span>
        <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Mon 2 Nov</span>
      </span>
    </button>
    <button type="button" aria-expanded="true" aria-label="Quick settings, open" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
