<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar auto-hide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:420px;box-sizing:border-box;padding:40px;overflow:hidden;background:#15170F;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;gap:20px">

  <!-- Hidden: a window reaches the bottom edge -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Hidden · a window overlaps the bar</span>
    <div style="position:relative;width:420px;height:290px;overflow:hidden;border-radius:18px;background:#0D0F09;border:1px solid #2A2F1F">
      <div style="position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:12px;background:#15170F;border:1px solid #39412A;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
        <span style="width:60%;height:8px;border-radius:4px;background:#AC8ED0"></span>
        <span style="width:80%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:46%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:70%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:52%;height:8px;border-radius:4px;background:#9FD88A"></span>
        <span style="width:74%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:38%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:66%;height:8px;border-radius:4px;background:#2A2F1F"></span>
      </div>
      <span style="position:absolute;left:50%;bottom:2px;width:72px;height:4px;margin-left:-36px;border-radius:2px;background:#A3B08F"></span>
    </div>
  </div>

  <!-- Revealed: pointer at the bottom edge -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">Revealed · pointer at the bottom edge</span>
    <div style="position:relative;width:420px;height:290px;overflow:hidden;border-radius:18px;background:#0D0F09;border:1px solid #2A2F1F">
      <div style="position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:12px;background:#15170F;border:1px solid #39412A;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
        <span style="width:60%;height:8px;border-radius:4px;background:#AC8ED0"></span>
        <span style="width:80%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:46%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:70%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:52%;height:8px;border-radius:4px;background:#9FD88A"></span>
        <span style="width:74%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:38%;height:8px;border-radius:4px;background:#2A2F1F"></span>
        <span style="width:66%;height:8px;border-radius:4px;background:#2A2F1F"></span>
      </div>

      <!-- Bar at 60% scale -->
      <div style="position:absolute;left:-110px;bottom:14px;width:640px;height:56px;transform:scale(.6);transform-origin:50% 100%;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 14px 36px rgba(0,0,0,.6)">
        <div style="display:flex;align-items:center;height:40px;padding:0 6px 0 10px">
          <button type="button" aria-label="Workspace 1" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
          <button type="button" aria-label="Workspace 2, active" aria-current="true" style="width:34px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:26px;height:8px;border-radius:4px;background:#9FD88A"></span></button>
          <button type="button" aria-label="Workspace 3" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:#A3B08F"></span></button>
          <button type="button" aria-label="Workspace 4, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
          <button type="button" aria-label="Workspace 5, empty" style="width:20px;height:40px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;box-sizing:border-box;border:1.5px solid #626F51"></span></button>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 4px">
          <span style="font-size:13px;font-weight:700;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#F6F8EF">src/main.rs</span>
          <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">nvim</span>
        </div>
        <button type="button" aria-label="Notifications. 11:25, Sunday 25 October" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 14px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer;text-align:left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span style="display:flex;flex-direction:column">
            <span style="font-size:14px;font-weight:800;line-height:17px;font-variant-numeric:tabular-nums;color:#F6F8EF">11:25</span>
            <span style="font-size:11px;font-weight:600;line-height:14px;color:#A3B08F">Sun 25 Oct</span>
          </span>
        </button>
        <button type="button" aria-label="Quick settings: Ethernet connected, Bluetooth on, volume 62%" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
