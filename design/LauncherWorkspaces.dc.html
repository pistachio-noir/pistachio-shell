<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher workspaces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;justify-content:center;padding-top:48px">

  <section aria-label="Launcher" style="width:640px;height:fit-content;display:flex;flex-direction:column;border-radius:28px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden">

    <label style="display:flex;align-items:center;gap:12px;height:68px;box-sizing:border-box;padding:0 26px">
      <span style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:#2A2F1F;color:#F6F8EF;font-size:13px;font-weight:700;flex:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 4v16"/></svg>
        Workspaces
      </span>
      <input type="text" value="" placeholder="Jump to a workspace…" aria-label="Jump to a workspace" style="flex:1;min-width:0;height:44px;border:0;outline:none;background:none;color:#F6F8EF;font-size:20px;font-weight:600;caret-color:#9FD88A;padding:0">
    </label>

    <div style="display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid #2A2F1F">
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">All</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Apps</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">Windows</button>
      <button type="button" aria-pressed="true" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#2A2F1F;color:#9FD88A;font-size:13px;font-weight:700;cursor:pointer">Workspaces</button>
      <button type="button" aria-pressed="false" style="height:36px;padding:0 16px;border:0;border-radius:18px;background:none;color:#A3B08F;font-size:13px;font-weight:700;cursor:pointer">System</button>
    </div>

    <div style="padding:14px 8px 8px">
      <span style="display:block;padding:0 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A3B08F">5 workspaces</span>
      <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:8px">

        <!-- 1 -->
        <button type="button" aria-label="Workspace 1, 1 window" style="height:148px;box-sizing:border-box;padding:12px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer">
          <span style="font-size:14px;font-weight:800;color:#F6F8EF">1</span>
          <span style="display:flex;gap:3px;height:56px;padding:4px;box-sizing:border-box;border-radius:8px;background:#15170F">
            <span style="flex:1;border-radius:4px;background:#39412A"></span>
          </span>
          <span style="display:flex;flex-direction:column;gap:1px">
            <span style="font-size:13px;font-weight:700">Notes</span>
            <span style="font-size:11px;font-weight:600;color:#A3B08F">1 window</span>
          </span>
        </button>

        <!-- 2: current -->
        <button type="button" aria-label="Workspace 2, current, 3 windows" aria-current="true" style="height:148px;box-sizing:border-box;padding:12px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer">
          <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#9FD88A">2<span style="width:6px;height:6px;border-radius:3px;background:#9FD88A"></span></span>
          <span style="display:flex;gap:3px;height:56px;padding:4px;box-sizing:border-box;border-radius:8px;background:#15170F">
            <span style="flex:1.4;border-radius:4px;background:#626F51"></span>
            <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="flex:1;border-radius:4px;background:#39412A"></span><span style="flex:1;border-radius:4px;background:#39412A"></span></span>
          </span>
          <span style="display:flex;flex-direction:column;gap:1px">
            <span style="font-size:13px;font-weight:700">Code</span>
            <span style="font-size:11px;font-weight:600;color:#A3B08F">3 windows</span>
          </span>
        </button>

        <!-- 3: cursor -->
        <button type="button" aria-label="Workspace 3, 1 window, selected" aria-selected="true" style="height:148px;box-sizing:border-box;padding:12px;border:0;border-radius:20px;background:#39412A;color:#F6F8EF;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer">
          <span style="display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;color:#F6F8EF">3<span style="min-width:18px;height:18px;border-radius:9px;background:#9FD88A;color:#15170F;display:flex;align-items:center;justify-content:center;font-size:11px">↵</span></span>
          <span style="display:flex;gap:3px;height:56px;padding:4px;box-sizing:border-box;border-radius:8px;background:#15170F">
            <span style="flex:1;border-radius:4px;background:#39412A"></span>
          </span>
          <span style="display:flex;flex-direction:column;gap:1px">
            <span style="font-size:13px;font-weight:700">Web</span>
            <span style="font-size:11px;font-weight:600;color:#A3B08F">1 window</span>
          </span>
        </button>

        <!-- 4: urgent -->
        <button type="button" aria-label="Workspace 4, 1 window needs attention" style="height:148px;box-sizing:border-box;padding:12px;border:0;border-radius:20px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer">
          <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#DB8267">4<span style="width:6px;height:6px;border-radius:3px;background:#DB8267"></span></span>
          <span style="display:flex;gap:3px;height:56px;padding:4px;box-sizing:border-box;border-radius:8px;background:#15170F">
            <span style="flex:1;border-radius:4px;background:#DB8267"></span>
          </span>
          <span style="display:flex;flex-direction:column;gap:1px">
            <span style="font-size:13px;font-weight:700">Build</span>
            <span style="font-size:11px;font-weight:600;color:#DB8267">Needs attention</span>
          </span>
        </button>

        <!-- 5: empty -->
        <button type="button" aria-label="Workspace 5, empty" style="height:148px;box-sizing:border-box;padding:11px;border:1px dashed #39412A;border-radius:20px;background:none;color:#E5E9D8;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer">
          <span style="font-size:14px;font-weight:800;color:#A3B08F">5</span>
          <span style="display:flex;gap:3px;height:56px;padding:4px;box-sizing:border-box;border-radius:8px;border:1px dashed #2A2F1F"></span>
          <span style="display:flex;flex-direction:column;gap:1px">
            <span style="font-size:13px;font-weight:700;color:#A3B08F">Empty</span>
            <span style="font-size:11px;font-weight:600;color:#A3B08F">No windows</span>
          </span>
        </button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:20px;height:46px;box-sizing:border-box;padding:0 26px;border-top:1px solid #2A2F1F;font-size:12px;font-weight:600;color:#A3B08F">
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">←→</span>choose</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">↵</span>go</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Shift ↵</span>send focused window here</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:7px;background:#2A2F1F;color:#E5E9D8;display:flex;align-items:center;justify-content:center;font-weight:800">Esc</span>close</span>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
