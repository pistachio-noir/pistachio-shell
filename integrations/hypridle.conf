# hypridle setup for the Pistachio Noir shell: lock after 10 minutes idle, screen off after 15, and
# always lock before the machine sleeps. Copy it to ~/.config/hypr/hypridle.conf and start hypridle
# with Hyprland (in hyprland.lua's autostart block: hl.exec_cmd("hypridle")).
# The shell's own Suspend (power menu) already locks first; this also covers `systemctl suspend`.

general {
    # what `loginctl lock-session` runs: the shell's lock screen (harmless if already locked)
    lock_cmd = qs -c pistachio ipc call lock lock
    # lock before any suspend
    before_sleep_cmd = loginctl lock-session
    # screen back on after waking
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# lock after 10 minutes without input
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screen off after 15 minutes, back on with any input
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
