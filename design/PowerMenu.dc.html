<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width:960px;height:540px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">

  <section aria-label="Power menu" style="display:flex;gap:12px;padding:24px;border-radius:32px;background:#1D2016;border:1px solid #39412A;box-shadow:0 24px 60px rgba(0,0,0,.65)">

    <button type="button" aria-label="Lock, key L" style="width:120px;height:132px;border:0;border-radius:24px;background:#39412A;color:#F6F8EF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9FD88A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span style="font-size:14px;font-weight:700">Lock</span>
      <span style="font-size:11px;font-weight:700;color:#A3B08F;letter-spacing:.06em">L</span>
    </button>

    <button type="button" aria-label="Log out, key E" style="width:120px;height:132px;border:0;border-radius:24px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      <span style="font-size:14px;font-weight:700">Log out</span>
      <span style="font-size:11px;font-weight:700;color:#A3B08F;letter-spacing:.06em">E</span>
    </button>

    <button type="button" aria-label="Suspend, key S" style="width:120px;height:132px;border:0;border-radius:24px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <span style="font-size:14px;font-weight:700">Suspend</span>
      <span style="font-size:11px;font-weight:700;color:#A3B08F;letter-spacing:.06em">S</span>
    </button>

    <button type="button" aria-label="Reboot, key R" style="width:120px;height:132px;border:0;border-radius:24px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      <span style="font-size:14px;font-weight:700">Reboot</span>
      <span style="font-size:11px;font-weight:700;color:#A3B08F;letter-spacing:.06em">R</span>
    </button>

    <button type="button" aria-label="Shut down, key P" style="width:120px;height:132px;border:0;border-radius:24px;background:#2A2F1F;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#DB8267" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg>
      <span style="font-size:14px;font-weight:700">Shut down</span>
      <span style="font-size:11px;font-weight:700;color:#A3B08F;letter-spacing:.06em">P</span>
    </button>

  </section>

  <span style="font-size:12px;font-weight:600;color:#A3B08F">← → move · Enter confirm · Esc cancel</span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
