<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
input{font:inherit}
</style>
</helmet>
<div style="position:relative;width:960px;height:600px;box-sizing:border-box;overflow:hidden;background:#0D0F09;font-family:'Manrope',system-ui,sans-serif;color:#E5E9D8;display:flex;flex-direction:column;align-items:center;justify-content:center">

  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-40px">
    <span style="font-size:132px;font-weight:800;line-height:132px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#F6F8EF">11:25</span>
    <span style="font-size:20px;font-weight:600;color:#A3B08F">Sunday, 25 October</span>
  </div>

  <div style="margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:16px">
    <span style="width:64px;height:64px;border-radius:32px;background:#2A2F1F;color:#A3B08F;display:flex;align-items:center;justify-content:center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </span>
    <label style="display:block">
      <input type="password" value="••••••" aria-label="Password" style="display:block;width:320px;height:56px;box-sizing:border-box;padding:0 24px;border:1px solid #39412A;border-radius:28px;background:#1D2016;color:#F6F8EF;font-size:18px;font-weight:700;letter-spacing:.2em;text-align:center;caret-color:#9FD88A;outline:none;box-shadow:0 14px 36px rgba(0,0,0,.55)">
    </label>
    <span style="font-size:12px;font-weight:600;color:#A3B08F">Enter to unlock</span>
  </div>

  <!-- Status capsule -->
  <div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);height:40px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:20px;background:#1D2016;border:1px solid #39412A;color:#E5E9D8">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 20 3-3h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2l3 3z"/><path d="M6 8v1"/><path d="M10 8v1"/><path d="M14 8v1"/><path d="M18 8v1"/></svg>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
